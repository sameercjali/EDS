<!DOCTYPE html>

  <title>Contact – ECODRIP SOLUTIONS</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      background: #2e7d32;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      color: white;
      z-index: 1000;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      position: relative;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 2px;
      background: #ffeb3b;
      transition: width 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    section {
      text-align: center;
      padding: 80px 20px;
    }

    section h2 {
      font-size: 2rem;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    section p {
      font-size: 1rem;
      margin: 10px 0;
    }

    iframe {
      width: 90%;
      max-width: 800px;
      height: 400px;
      border: none;
      border-radius: 15px;
      margin-top: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    footer {
      background: #2e7d32;
      color: white;
      text-align: center;
      padding: 18px 0;
      margin-top: auto;
      font-size: 0.9rem;
    }
  </style>
</head>
